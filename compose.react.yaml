# Optional development overlay, used with compose.yaml and compose.email.yaml.
services:
  web:
    environment:
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: /api
      DJANGO_PROXY_TARGET: http://web:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_dist:/app/dist
    command: sh -c "npm ci && npm run dev"
    depends_on:
      web:
        condition: service_started
volumes:
  frontend_node_modules:
  frontend_dist:
