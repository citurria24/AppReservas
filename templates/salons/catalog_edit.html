{% extends "base.html" %}
{% block title %}{{ title }} · {{ salon.name }}{% endblock %}
{% block content %}
<section class="booking-shell narrow">
  <div class="page-heading">
    <a class="back" href="{{ cancel_url }}">← Volver al catálogo</a>
    <p class="eyebrow">{{ section }}</p>
    <h1>{{ title }}</h1>
  </div>
  <form method="post" class="panel booking-form">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}<div class="field{% if field.field.widget.input_type == 'checkbox' %} checkbox-field{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
    <button class="primary" type="submit">Guardar cambios</button>
    <a class="secondary" href="{{ cancel_url }}">Cancelar</a>
  </form>
</section>
{% endblock %}
