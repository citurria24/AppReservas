{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TuTurnoUy{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="https://unpkg.com/htmx.org@2.0.7" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'dashboard' %}">TuTurno<span>Uy</span></a>
    {% if user.is_authenticated %}
      <div class="account">
        <span>{{ user.get_full_name|default:user.username }}</span>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="link-button" type="submit">Salir</button>
        </form>
      </div>
    {% endif %}
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
</body>
</html>
